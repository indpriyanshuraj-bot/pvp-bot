name: CI

# Development branches get CI only. `main` is handled by release.yml, which runs
# the same suite and then publishes a release if it passes.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: bash scripts/ci.sh
