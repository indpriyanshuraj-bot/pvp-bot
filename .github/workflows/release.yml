name: Release

on:
  push:
    branches: [v3-dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: bash scripts/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: addon/dist
          if-no-files-found: ignore

  promote:
    needs: ci
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward released to the tested commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:released
