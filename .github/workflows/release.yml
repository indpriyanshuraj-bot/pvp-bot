name: Release

# Every push to main runs the full suite. Only if all seven gates pass does it
# tag the commit and publish a GitHub Release with the built .mcaddon attached,
# which is what you download and install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - name: Full CI suite
        run: bash scripts/ci.sh
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pack
          path: addon/dist
          if-no-files-found: error

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pack
          path: pack

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(node -p "require('./addon/package.json').version")
          TAG="v${VERSION}"

          # If that exact version was already released, fall back to a build tag
          # so every green main build still produces a downloadable release.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          fi

          ARTIFACT=$(ls pack/*.mcaddon)
          echo "Publishing ${TAG} with ${ARTIFACT}"

          git tag -a "${TAG}" -m "Automated release ${TAG} from ${GITHUB_SHA}"
          git push origin "${TAG}"

          # --notes takes a single value, so build the body in a file.
          cat > /tmp/notes.md <<NOTES
          Automated release from commit \`${GITHUB_SHA:0:7}\`.

          All seven CI gates passed: typecheck, purity, unit tests, bundle,
          ESM portability, pack validation, gametest inventory.

          **Install:** download the \`.mcaddon\` below and open it, or drop it into
          a world. Requires the **Beta APIs** experiment to be enabled.

          **Test it:** see \`addon/TESTING.md\` for the command-by-command guide.
          NOTES

          gh release create "${TAG}" "${ARTIFACT}" \
            --title "${TAG}" \
            --notes-file /tmp/notes.md
